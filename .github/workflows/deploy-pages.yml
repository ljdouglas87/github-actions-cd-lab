name: Deploy website

on:
  push:
    branches: [main]
    paths:                         # the site, this file, and the files it reuses
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/smoke-test.yml'
      - '.github/actions/stamp-site/**'
  workflow_dispatch:

permissions:
  contents: read                   # the default for every job: read the repository

concurrency:
  group: pages                     # one deployment at a time
  cancel-in-progress: false        # never stop a deployment halfway

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Stamp the site
        uses: ./.github/actions/stamp-site     # a composite action in this repository
        with:
          folder: site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:                   # replaces contents: read for this job only
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:                       # passes the site's address on to the verify job
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Show deployment configuration
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}   # an environment secret
        run: |
          echo "Release channel: ${{ vars.RELEASE_CHANNEL }}"
          if [ -n "$DEPLOY_KEY" ]; then
            echo "Deploy key: received"
          else
            echo "Deploy key: missing"
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    needs: deploy
    uses: ./.github/workflows/smoke-test.yml   # a reusable workflow, called as a whole job
    with:
      url: ${{ needs.deploy.outputs.page_url }}
    secrets:
      smoke-test-key: ${{ secrets.SMOKE_TEST_KEY }}

  report:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Add the verified commit to the run summary
        env:
          LIVE_COMMIT: ${{ needs.verify.outputs.live-commit }}
        run: |
          echo "### Live and verified: commit $LIVE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
