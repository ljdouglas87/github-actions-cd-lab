name: Issue title

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  greet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print the title (safe)
        env:
          TITLE: ${{ github.event.issue.title }}   # the title arrives as data
        run: echo "New issue - $TITLE"
